<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- =====================================================================
     EVENT MICROSITE — one file, three versions.
       /                  → showcase: sidebar to switch versions, Desktop/Phone, Effects
       /?view=onepage     → One screen, full screen (send this to guests)
       /?view=slides      → Slides, full screen
       /?view=scroll      → Scrolling, full screen
       add &to=Name       → personal invite ("Name, you're invited")
     Edit the EVENT block below, then commit. Vercel serves this file as is.
     ===================================================================== -->
<title>Biohack Miami x Farmasi</title>
<!-- LINK PREVIEW (iMessage, WhatsApp, Slack, X). Update these lines when you change the event. -->
<meta name="description" content="Sunday, November 15. Miami Beach, FL. An exclusive reception at a private mansion on the Venetian Islands for creators, founders, doctors and brand partners in health, longevity and beauty.">
<meta property="og:title" content="Biohack Miami x Farmasi">
<meta property="og:description" content="Sunday, November 15. Miami Beach, FL. An exclusive reception at a private mansion on the Venetian Islands for creators, founders, doctors and brand partners in health, longevity and beauty.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://api.therumor.com/users/v1/files/view/profile/96a4f5d7-fecf-4d9a-9fed-50cc6c2ab5d5.png">
<meta name="theme-color" content="#0B0910">

<!-- =====================================================================
     EVENT — the only part you need to edit. Every version reads from it.
     ===================================================================== -->
<script>
window.EVENT = {
  /* ---------- Names ---------- */
  brand: "Biohack Miami",                         // next to the logo (top-left) and in the preloaders
  logo: "",                                       // "" = the Rumor R mark, or an image URL (light artwork) for a brand logo
  logoOnly: false,                                // true = show the logo without the brand text
  title: "Biohack Miami x Farmasi",               // browser tab, details popup, calendar entry, link preview
  hosts: ["Biohack Miami", "Farmasi"],            // "Hosted by"

  /* ---------- The big line ---------- */
  lead: ["Biohack Miami × Farmasi present", "Longevity at"],  // 1–2 short lines that read into the giant word
  giant: "Sundown",                               // ONE word, sized to fill the width, set in textured noise purple
  preloadLine: "",                                // slides preloader line; "" = last lead line + giant word

  /* ---------- Copy ---------- */
  intro: "An exclusive reception at a private mansion on the Venetian Islands for creators, founders, doctors and brand partners in health, longevity and beauty.",
  served: ["Passed bites", "open bar & live DJ"], // two short lines

  /* ---------- When (local time at the venue) ---------- */
  date: "2026-11-15",                             // YYYY-MM-DD
  startTime: "19:30",                             // 24h HH:MM
  endTime: "22:00",
  timezone: "America/New_York",

  /* ---------- Where ---------- */
  venue: {
    name: "Private waterfront residence",
    short: "Venetian Islands",                    // fits on a card
    city: "Miami Beach, FL",
    address: "",                                  // "" = gated: the card says the address comes after RSVP
    mapsQuery: ""                                 // e.g. "85 NE 29th St Miami FL 33137" (only used when address is set)
  },

  /* ---------- Photo (slides and scrolling heroes, link preview) ---------- */
  cover: "https://api.therumor.com/users/v1/files/view/profile/96a4f5d7-fecf-4d9a-9fed-50cc6c2ab5d5.png",
  coverAlt: "Event flyer: a white waterfront mansion with a pool at dusk",

  /* ---------- RSVP ---------- */
  rsvp: {
    mode: "demo",                                 // "demo" = in-page flow: phone → 4-digit code (1234) → request received. Nothing is sent.
                                                  // "link" = every RSVP button opens `url` in a new tab
    url: "https://therumor.com/p/143174",
    note: "Request-only: the host approves each RSVP.",
    demoNote: "Demo: nothing is sent or saved. Use any number and the code 1234."
  },

  /* ---------- Colour: Rumor purple-black, white and one purple ---------- */
  theme: {
    paper:  "#0B0910",   // page background (grain and light leak sit on top)
    ink:    "#FFFFFF",   // text
    card:   "#17131F",   // cards
    card2:  "#211B2C",   // card hover
    mute:   "#8F88A0",   // secondary text
    accent: "#8B6CFF",   // the O disc, hero word, primary button, door seam, selection
    pop:    "#D9CEFF",   // preloader wipe (scrolling version)
    sky:    "#FFFFFF"    // preloader wipe (scrolling version)
  },

  /* ---------- Effects: all off by default. Turn any on here, or try them live in the showcase sidebar ---------- */
  effects: {
    shadows: false,      // depth shadows under cards, buttons and popups
    glow: false,         // purple light leak and glowing RSVP button
    gradients: false,    // fading hero word, photo shading
    grain: false         // film grain over the page and cards
  }
};

</script>

<!-- Shared design system and the three versions (assembled in the browser) -->
<script type="text/plain" id="kit-css">
/* =====================================================================
   KIT — shared design system for every version.
   Rumor palette with a premium, tactile finish: purple-black ground, film grain over everything,
   one soft light leak, condensed display type, tracked mono labels.
   Colours are set from event.js → theme by kit.js.
   ===================================================================== */
:root{
  /* Rumor: purple-black, white, one purple */
  --paper:#0B0910; --ink:#FFFFFF; --card:#17131F; --card2:#211B2C; --mute:#8F88A0;
  --accent:#8B6CFF; --pop:#D9CEFF; --sky:#FFFFFF; --white:#fff;
  --line:rgba(255,255,255,.14);
  --ease:cubic-bezier(.22,.8,.2,1); --spring:cubic-bezier(.34,1.5,.64,1);
  --pad:clamp(16px,2.2vw,32px);
  --sans:"Inter Tight", system-ui, sans-serif;
  --display:"Barlow Condensed", "Inter Tight", system-ui, sans-serif;
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}

/* ---------- Atmosphere: one light leak behind everything, film grain over everything ---------- */
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:radial-gradient(50% 40% at 50% 18%,color-mix(in oklab,var(--accent) 22%,transparent),transparent 70%),
             radial-gradient(40% 35% at 88% 92%,color-mix(in oklab,var(--accent) 10%,transparent),transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:95;pointer-events:none;background-image:var(--grain);background-size:180px;opacity:.07;mix-blend-mode:screen}
@media (prefers-reduced-transparency: reduce){ body::after{display:none} }

/* ---------- Type roles: condensed display for the big words, Inter Tight for everything else ---------- */
.lead,.giant,.modal__title,.sec__h{font-family:var(--display)}
.lead{font-weight:600;letter-spacing:-.005em}
.giant{font-weight:700}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
img,svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ---------- Nav ---------- */
.nav{height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.nav .brand{justify-self:start}
.nav__right{grid-column:3;justify-self:end}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:-.01em}
.brand .rmark{width:20px;height:20px;flex:none}
::selection{background:var(--accent);color:var(--paper)}
.brand .logo{height:24px;width:auto;max-width:140px;object-fit:contain}
.nav__right{display:flex;align-items:center;gap:18px}

/* ---------- Pills ---------- */
.pill{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 22px;border-radius:999px;
  font-size:14px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;transition:color .25s,transform .2s var(--ease)}
.pill::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;transform:translateY(101%);transition:transform .4s var(--ease)}
.pill:active{transform:scale(.97)}
.pill svg{width:14px;height:14px;transition:transform .35s var(--spring)}
.pill--ink{background:var(--ink);color:var(--paper)}
.pill--ink::before{background:var(--accent)}
.pill--accent{background:var(--accent);color:var(--paper);box-shadow:0 14px 40px -14px color-mix(in oklab,var(--accent) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.pill--accent::before{background:var(--ink)}
.pill--ghost{box-shadow:inset 0 0 0 1px var(--line)}
.pill--ghost::before{background:var(--ink)}
.pill[aria-disabled="true"]{opacity:.55;pointer-events:none}
.pill--block{width:100%;height:54px;font-size:16px}
body.requested .pill--accent[data-rsvp]{background:var(--card);color:var(--ink)}
body.requested .pill--accent[data-rsvp]::before{background:var(--card2)}

@media (hover:hover){
  .pill:hover::before{transform:translateY(0)}
  .pill--ghost:hover{color:var(--paper)}
  .pill:hover svg{transform:translateX(3px)}
}

/* ---------- Nav link (the quiet secondary action) ---------- */
.navlink{height:44px;padding:0 4px;font-size:14px;font-weight:500;color:var(--mute);transition:color .2s ease}
.navlink:hover{color:var(--ink)}

/* ---------- Hero: lead line, giant word, one action row ---------- */
.lead{margin:0;text-align:left;font-weight:600;font-size:clamp(20px,min(2.6vw,4.2vh),40px);line-height:.98;letter-spacing:0;text-transform:uppercase;color:var(--mute)}
.lead span{display:block}
.giant{position:relative;z-index:1;margin:0;text-align:left;font-weight:700;line-height:.84;letter-spacing:-.015em;text-transform:uppercase;white-space:nowrap;
  color:var(--ink);user-select:none;overflow:hidden;padding-bottom:.02em}
.giant > span{display:inline-block;transform-origin:50% 100%}

.act-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:clamp(16px,2.6vh,28px);border-top:1px solid var(--line)}
.pill--cta{height:56px;padding:0 28px;font-size:16px;gap:12px}
.pill--cta svg{width:16px;height:16px}
.act-row__meta{margin:0;text-align:right;font-size:14px;line-height:1.45;font-weight:500;color:var(--ink)}
.act-row__meta span{display:block;color:var(--mute)}
@media (max-width:640px){
  .act-row{flex-direction:column;align-items:stretch;gap:14px}
  .act-row .pill--cta{width:100%}
  .act-row__meta{text-align:left}
}

/* ---------- Copy ---------- */
.copy p{margin:0 0 18px;font-size:14.5px;line-height:1.45;font-weight:500}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.meta{display:grid;gap:14px;margin:0}
.meta dt{font-size:12px;color:var(--mute);margin-bottom:3px}
.meta dd{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}

/* ---------- Detail cards ---------- */
.cards{position:relative;z-index:3;display:grid;grid-template-columns:1fr .9fr 1.2fr 1.3fr;gap:10px}
@media (max-width:900px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} }
.card{position:relative;min-width:0;overflow:hidden;min-height:clamp(96px,14vh,128px);padding:16px 18px;border-radius:20px;background:var(--card);color:var(--ink);background-image:var(--grain);background-size:180px;background-blend-mode:soft-light;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.05),0 24px 50px -30px rgba(0,0,0,.9);
  display:flex;flex-direction:column;justify-content:space-between;gap:10px;transition:transform .45s var(--spring),background-color .25s}
.card__big{font-size:clamp(22px,min(2.6vw,4.2vh),40px);font-weight:500;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;padding-right:40px}
.card__lbl{font-size:12.5px;opacity:.68}
@media (hover:hover){
  .card:hover{transform:translateY(-4px)}
  button.card:hover,.card--where:hover{background:var(--card2)}
}
.act{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--ink);
  transition:transform .5s var(--spring),background-color .2s,color .2s}
.act svg{width:15px;height:15px;grid-area:1/1;transition:opacity .2s,transform .4s var(--spring)}
.act .ok{opacity:0;transform:scale(.4) rotate(-30deg)}
.is-done .act{background:var(--accent);color:var(--paper)}
.is-done .act .base{opacity:0;transform:scale(.4) rotate(30deg)}
.is-done .act .ok{opacity:1;transform:none}
@media (hover:hover){ .card:hover .act{transform:rotate(90deg)} }
.copybtn{display:block;text-align:left}
.count{white-space:nowrap;font-size:clamp(18px,min(2.2vw,3.6vh),34px)}
.digit{display:inline-block}
.digit.tick{animation:tick .4s var(--ease)}
@keyframes tick{from{transform:translateY(-35%);opacity:0}to{transform:none;opacity:1}}

/* ---------- Modal ---------- */
.modal{padding:0;border:0;background:transparent;color:inherit;width:min(560px,calc(100vw - 32px));max-height:calc(100svh - 32px);overflow:visible}
.modal::backdrop{background:color-mix(in oklab,var(--paper) 70%,rgba(0,0,0,.6));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .3s var(--ease)}
.modal[open] .modal__panel{animation:pop .5s var(--spring)}
.modal.closing .modal__panel{animation:drop .22s var(--ease) forwards}
.modal.closing::backdrop{animation:fade .22s var(--ease) reverse forwards}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}}
@keyframes drop{to{opacity:0;transform:translateY(12px) scale(.98)}}
.modal__panel{position:relative;background:var(--ink);color:var(--paper);border-radius:28px;padding:28px;max-height:calc(100svh - 32px);overflow:auto}
.modal__head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.modal__over{margin:0 0 8px;font-size:13px;font-weight:600;color:color-mix(in oklab,var(--accent) 70%,var(--paper))}
.modal__title{margin:0;font-size:clamp(34px,5vw,48px);line-height:.92;font-weight:700;letter-spacing:-.01em;text-transform:uppercase}
.x{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab,var(--paper) 8%,transparent);color:var(--paper);transition:transform .45s var(--spring),background-color .2s}
.x svg{width:16px;height:16px}
@media (hover:hover){ .x:hover{transform:rotate(90deg);background:color-mix(in oklab,var(--paper) 14%,transparent)} }
.rows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-radius:18px;background:color-mix(in oklab,var(--paper) 6%,transparent);transition:background-color .2s}
.modal[open] .row{animation:rowin .55s var(--ease) both;animation-delay:calc(.08s + var(--i) * 50ms)}
@keyframes rowin{from{opacity:0;transform:translateY(10px)}}
@media (hover:hover){ .row:hover{background:color-mix(in oklab,var(--paper) 10%,transparent)} }
.row__k{font-size:12.5px;font-weight:600;color:color-mix(in oklab,var(--paper) 55%,transparent)}
.row__v{font-size:15.5px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.row__v small{display:block;font-size:13px;font-weight:500;color:color-mix(in oklab,var(--paper) 60%,transparent);letter-spacing:0}
.chip{height:34px;padding:0 14px;border-radius:999px;background:var(--paper);color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap;transition:background-color .2s,transform .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip{display:inline-flex;align-items:center}
.chips{display:flex;gap:6px}
.chip.is-done{background:color-mix(in oklab,var(--accent) 70%,var(--paper))}
.modal__foot{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.modal__foot .pill{flex:1;height:48px}
.modal .pill--ghost{box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--paper) 18%,transparent)}
.modal .pill--ghost::before{background:var(--paper)}
.modal .pill--ghost:hover{color:var(--ink)}
@media (max-width:720px){
  .modal{width:100vw;max-width:100vw;margin:auto 0 0;max-height:92svh}
  .modal__panel{border-radius:26px 26px 0 0;padding:30px 18px calc(18px + env(safe-area-inset-bottom));max-height:92svh}
  .modal__panel::before{content:"";position:absolute;top:10px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:5px;background:color-mix(in oklab,var(--paper) 22%,transparent)}
  .modal__head{touch-action:none;cursor:grab}
  .modal[open] .modal__panel{animation:sheet .5s var(--ease)}
  .modal.closing .modal__panel{animation:sheet-out .25s var(--ease) forwards}
  @keyframes sheet{from{transform:translateY(100%)}}
  @keyframes sheet-out{to{transform:translateY(100%)}}
  .row{grid-template-columns:1fr auto}
  .row__k{grid-column:1/-1;margin-bottom:-6px}
  .modal__foot .pill:first-child{flex-basis:100%}
}

/* ---------- RSVP form ---------- */
.step--in{animation:rowin .45s var(--ease) both}
.form{display:grid;gap:14px}
.field{display:grid;gap:7px}
.field > span:first-child{font-size:12.5px;font-weight:600;color:color-mix(in oklab,var(--paper) 58%,transparent)}
.field input,.field select,.otp input{font:inherit;font-size:17px;font-weight:500;color:var(--paper);background:transparent;height:54px;padding:0 16px;border-radius:14px;
  border:1px solid color-mix(in oklab,var(--paper) 20%,transparent);transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:color-mix(in oklab,var(--paper) 35%,transparent)}
.field input:focus,.field select:focus,.otp input:focus{outline:none;border-color:var(--paper);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 45%,transparent)}
.phone{display:grid;grid-template-columns:92px 1fr;gap:8px}
.phone select{padding-right:8px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.otp{display:grid;grid-template-columns:repeat(4,minmax(0,68px));gap:10px;margin:4px 0}
.otp input{height:76px;padding:0;text-align:center;font-size:32px;font-weight:600;font-variant-numeric:tabular-nums}
.form__lead{margin:0 0 4px;font-size:15.5px;line-height:1.45;font-weight:500}
.form__err{margin:0;min-height:1.2em;font-size:13.5px;font-weight:600;color:#B4410C}
.form__err:empty{min-height:0;margin-top:-14px}
.form__note{margin:0;font-size:13px;line-height:1.45;color:color-mix(in oklab,var(--paper) 58%,transparent)}
.link{font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--paper)}
.modal--rsvp .rows{margin:18px 0 0}
.shake{animation:shake .4s var(--ease)}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;z-index:80;height:42px;padding:0 18px;border-radius:999px;display:inline-flex;align-items:center;background:var(--ink);color:var(--paper);
  font-size:14px;font-weight:500;opacity:0;translate:-50% 16px;transition:opacity .2s,translate .45s var(--spring);pointer-events:none}
.toast.show{opacity:1;translate:-50% 0}

/* ---------- Preloader: mark draws, bar + 000 count, three colour panels lift ---------- */
.loader{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;transition:transform 1s cubic-bezier(.77,0,.18,1)}
.loader__inner{display:grid;justify-items:center;gap:22px}
.loader__mark{display:flex;align-items:center;gap:12px;font-weight:600;font-size:22px;letter-spacing:-.03em}
.loader__mark svg{width:40px;height:40px}
.loader__mark .rmark{width:30px;height:30px;color:var(--ink);opacity:0;transform:scale(.7) rotate(-8deg);animation:rin .9s .1s var(--spring) forwards}
.loader__mark--big .rmark{width:clamp(72px,9vw,108px);height:clamp(72px,9vw,108px)}
.blur__top .rmark{width:26px;height:26px}
@keyframes rin{to{opacity:1;transform:none}}
.loader__mark img{height:48px;width:auto;max-width:180px;object-fit:contain}
.loader__bar{width:min(220px,60vw);height:2px;background:rgba(255,255,255,.14);overflow:hidden}
.loader__bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}
.loader__num{font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--mute);font-variant-numeric:tabular-nums}
.wipe{position:fixed;inset:0;transition:transform 1s cubic-bezier(.77,0,.18,1)}
.wipe--1{background:var(--pop);z-index:99}
.wipe--2{background:var(--sky);z-index:98}
.wipe--3{background:var(--accent);z-index:97}
body.revealing .loader{transform:translateY(-100%)}
body.revealing .wipe--1{transform:translateY(-100%);transition-delay:.09s}
body.revealing .wipe--2{transform:translateY(-100%);transition-delay:.18s}
body.revealing .wipe--3{transform:translateY(-100%);transition-delay:.27s}

.pre{position:fixed;inset:0;z-index:100}

/* ---------- Preloader 2: doors ---------- */
.door{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;background:var(--paper);transition:transform 1.1s cubic-bezier(.77,0,.18,1)}
.door--l{left:0;box-shadow:inset -1px 0 0 color-mix(in oklab,var(--ink) 10%,transparent)}
.door--r{right:0}
.door__in{position:absolute;top:0;bottom:0;width:100vw;display:grid;place-items:center}
.door--l .door__in{left:0}
.door--r .door__in{right:0}
.door__face{display:grid;justify-items:center;gap:18px}
.loader__mark--big svg{width:clamp(96px,13vw,150px);height:clamp(96px,13vw,150px)}
.loader__mark--big img{height:clamp(56px,8vw,96px)}
.door__brand{font-weight:600;font-size:clamp(18px,1.6vw,22px);letter-spacing:-.03em;opacity:0;transition:opacity .6s var(--ease) .5s}
.pre--doors .loader__num{opacity:0;transition:opacity .6s var(--ease) .7s}
.pre--doors.is-on .door__brand,.pre--doors.is-on .loader__num{opacity:1}
.door__seam{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);transform:scaleY(0);transition:transform .35s var(--ease),opacity .3s ease .55s}
.pre--doors.is-open .door__seam{transform:scaleY(1);opacity:0}
.pre--doors.is-open .door--l{transform:translateX(-101%);transition-delay:.3s}
.pre--doors.is-open .door--r{transform:translateX(101%);transition-delay:.3s}

/* ---------- Preloader 3: blur reveal ---------- */
.pre--blur{background:var(--paper);display:grid;grid-template-rows:auto 1fr auto;justify-items:center;padding:clamp(28px,6vh,56px) 24px calc(clamp(28px,6vh,56px) + env(safe-area-inset-bottom));transition:opacity .55s ease .35s}
.pre--blur > *{transition:opacity .6s var(--ease),filter .6s var(--ease),transform .6s var(--ease)}
.blur__top{opacity:0}
.pre--blur.is-on .blur__top{opacity:1}
.blur__top svg{width:30px;height:30px}
.blur__top img{height:28px;width:auto}
.blur__line{align-self:center;margin:0;text-align:center;font-size:clamp(11px,1vw,13.5px);font-weight:600;letter-spacing:.42em;text-transform:uppercase;line-height:2.2;max-width:min(92vw,960px);padding-left:.42em}
.blur__line span{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(3px);transition:opacity .9s var(--ease),filter .9s var(--ease),transform .9s var(--ease);transition-delay:calc(.25s + var(--w) * .16s)}
.pre--blur.is-on .blur__line span{opacity:1;filter:blur(0);transform:none}
.blur__line .last{color:var(--accent)}
.blur__bar{width:min(220px,50vw);height:2px;background:color-mix(in oklab,var(--ink) 14%,transparent);overflow:hidden;opacity:0}
.pre--blur.is-on .blur__bar{opacity:1}
.blur__bar i{display:block;height:100%;width:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}
.pre--blur.is-out > *{opacity:0!important;filter:blur(12px);transform:scale(1.03)}
.pre--blur.is-out{opacity:0}

/* ---------- Entrance (one orchestrated moment after the preloader) ---------- */
.e{opacity:0;translate:0 18px}
.giant > span{translate:0 105%}
body.in .e{opacity:1;translate:0 0;transition:opacity .7s var(--ease),translate .8s var(--ease),transform .45s var(--spring),background-color .25s;transition-delay:var(--d,0s)}
body.in .giant > span{translate:0 0;transition:translate 1s var(--ease),transform .5s var(--spring);transition-delay:calc(.25s + var(--k) * 45ms)}

@media (prefers-reduced-motion: reduce){
  .loader,.wipe{display:none}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .e,.giant > span{opacity:1!important;translate:none!important;scale:none!important}
}

/* ---------- Film grade on photos ---------- */
.panel__media img,.media img{filter:contrast(1.06) saturate(.88) brightness(.96)}
.card__big{font-family:var(--display);font-weight:600;letter-spacing:-.005em;font-size:clamp(26px,min(3vw,4.8vh),46px)}

/* =====================================================================
   EFFECT SWITCHES — classes on <html>, set from event.js `effects`
   or live from the showcase sidebar. Outlines and focus rings are kept.
   ===================================================================== */
/* Shadows off: no depth shadows under cards, buttons, popups */
html.fx-no-shadow .card{box-shadow:inset 0 0 0 1px var(--line)!important}
html.fx-no-shadow .pill--accent,html.fx-no-shadow .modal__panel,html.fx-no-shadow .toast,
html.fx-no-shadow .media,html.fx-no-shadow .panel,html.fx-no-shadow .door--l{box-shadow:none!important}
html.fx-no-shadow *{text-shadow:none!important}

/* Neon glow off: no light leak, no glowing button, no pulsing dot */
html.fx-no-glow body::before{display:none}
html.fx-no-glow .pill--accent{box-shadow:none!important}
html.fx-no-glow .status i{animation:none!important;box-shadow:none!important}

/* Gradients off: flat colour everywhere */
html.fx-no-gradient body::before{display:none}
html.fx-no-gradient .panel::after{background:rgba(0,0,0,.55)!important}
html.fx-no-gradient .ticker{-webkit-mask-image:none!important;mask-image:none!important}

/* Grain off: no film grain over the page or inside cards */
html.fx-no-grain body::after{display:none}
html.fx-no-grain .card{background-image:none}

</script>
<script type="text/plain" id="kit-js">
/* =====================================================================
   KIT — shared behaviour for every version.
   Reads window.EVENT (event.js) and gives each page ready-made blocks:
   Kit.nav() Kit.lead() Kit.giant() Kit.cta() Kit.copy() Kit.meta() Kit.cards()
   plus the preloaders, details popup, in-page RSVP flow, toast, calendar, copy address,
   countdown and effect switches.
   ===================================================================== */
(() => {
  const E = window.EVENT || {};
  const V = E.venue || {};
  const T = E.theme || {};
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s = "") => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const has = (v) => Array.isArray(v) ? v.length > 0 : !!(v && String(v).trim());

  /* the Rumor "R" mark (from therumor.com) */
  const R_PATH = "M26.8069 20.2838H4.25358C3.52721 20.2838 2.93493 19.7067 2.93493 18.9989C2.93493 18.2911 3.52721 17.714 4.25358 17.714H26.8069C31.82 17.714 35.8966 13.7396 35.8966 8.85701C35.8966 3.97444 31.82 0 26.8069 0H2.51922V0.81231H16.3963C20.949 0.81231 24.6546 4.42088 24.6546 8.85919C24.6546 13.2975 20.9512 16.9061 16.3963 16.9061H4.25358C3.0668 16.9061 2.10352 17.8469 2.10352 19.0011C2.10352 20.1553 3.06903 21.0961 4.25358 21.0961H16.3963C20.949 21.0961 24.6546 24.7047 24.6546 29.143V38H35.8966V29.143C35.8966 24.2582 31.82 20.286 26.8069 20.286V20.2838Z";
  const RUMOR = (cls = "rmark") => `<svg class="${cls}" viewBox="0 0 38 38" aria-hidden="true"><path d="${R_PATH}" fill="currentColor"/></svg>`;

  /* theme */
  const root = document.documentElement.style;
  Object.entries(T).forEach(([k, v]) => v && root.setProperty("--" + k, v));
  if (T.paper) { const m = document.querySelector('meta[name="theme-color"]') || Object.assign(document.createElement("meta"), { name: "theme-color" }); m.content = T.paper; document.head.appendChild(m); }
  document.title = E.title || document.title;

  /* effect switches: event.js `effects` → classes on <html> (the showcase sidebar can change them live) */
  const setEffects = (fx = {}) => {
    const h = document.documentElement.classList;
    h.toggle("fx-no-shadow", fx.shadows === false);
    h.toggle("fx-no-glow", fx.glow === false);
    h.toggle("fx-no-gradient", fx.gradients === false);
    h.toggle("fx-no-grain", fx.grain === false);
  };
  setEffects(E.effects);

  /* personal invite: ?to=Sarah → "Sarah, you're invited" in the tab, details popup and RSVP form */
  let guest = "";
  const qs = () => { try { return window.parent !== window && window.parent.location.search ? window.parent.location.search : location.search; } catch { return location.search; } };
  try { guest = (new URLSearchParams(qs()).get("to") || "").replace(/[^\p{L}\p{N} .'&-]/gu, "").trim().slice(0, 32); } catch {}
  if (guest) document.title = `${guest}, you're invited: ${E.title || ""}`;

  /* favicon: the sunset mark in the event's colours */
  try {
    const p = T.paper || "#000", ink = T.ink || "#fff";
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="${p}"/><g transform="translate(22 22) scale(1.47)" fill="${ink}"><path d="${R_PATH}"/></g></svg>`;
    const link = document.querySelector('link[rel="icon"]') || Object.assign(document.createElement("link"), { rel: "icon" });
    link.href = "data:image/svg+xml," + encodeURIComponent(svg); document.head.appendChild(link);
  } catch {}
  const mark = E.logo ? `<img class="logo" src="${esc(E.logo)}" alt="">` : RUMOR();

  /* ---------- dates (wall time at the venue → real instants) ---------- */
  const [Y, M, D] = (E.date || "").split("-").map(Number);
  const hm = (s) => (s || "00:00").split(":").map(Number);
  const tz = E.timezone || "America/New_York";
  const zoned = (h, mi) => {
    const guess = Date.UTC(Y, M - 1, D, h, mi);
    const p = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).formatToParts(new Date(guess));
    const g = (k) => +p.find(x => x.type === k).value;
    return guess - (Date.UTC(g("year"), g("month") - 1, g("day"), g("hour"), g("minute")) - guess);
  };
  const hasDate = !!Y;
  const START = hasDate ? zoned(...hm(E.startTime)) : 0;
  const END = hasDate ? (E.endTime ? zoned(...hm(E.endTime)) + (hm(E.endTime)[0] < hm(E.startTime)[0] ? 864e5 : 0) : START + 4 * 36e5) : 0;
  const local = hasDate ? new Date(Y, M - 1, D) : null;
  const t12 = (s, withAp = true) => { if (!s) return ""; const [h, mi] = hm(s); return ((h + 11) % 12 + 1) + ":" + String(mi).padStart(2, "0") + (withAp ? (h >= 12 ? " pm" : " am") : ""); };
  const sameHalf = E.endTime && (hm(E.startTime)[0] >= 12) === (hm(E.endTime)[0] >= 12);
  const F = {
    short: local ? local.toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "",
    weekday: local ? local.toLocaleDateString("en-US", { weekday: "long" }) : "",
    long: local ? local.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }) : "",
    num: local ? `${String(M).padStart(2, "0")}.${String(D).padStart(2, "0")}.${String(Y).slice(2)}` : "",
    start: t12(E.startTime), end: E.endTime ? t12(E.endTime) : "late",
    range: E.startTime ? (sameHalf ? `${t12(E.startTime, false)} – ${t12(E.endTime)}` : `${t12(E.startTime)} – ${E.endTime ? t12(E.endTime) : "late"}`) : ""
  };
  const R = Object.assign({ mode: E.rsvpUrl ? "link" : "demo", url: E.rsvpUrl || "", note: "Request-only: the host approves each RSVP.", demoNote: "Demo: nothing is sent or saved. Use any number and the code 1234." }, E.rsvp || {});
  const demo = R.mode !== "link";
  const host1 = (E.hosts || [])[0] || "The host";
  const address = V.address ? [V.address, V.city].filter(Boolean).join(", ") : "";
  const utc = (t) => new Date(t).toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const gcal = hasDate ? "https://calendar.google.com/calendar/render?" + new URLSearchParams({ action: "TEMPLATE", text: E.title || "", dates: utc(START) + "/" + utc(END),
    details: (E.intro || "") + (R.url ? "\n\nRSVP: " + R.url : ""), location: address || [V.name, V.city].filter(Boolean).join(", ") }) : "";
  const calChips = () => hasDate ? `<span class="chips"><button class="chip" type="button" data-act="cal">Apple</button><a class="chip" href="${gcal}" target="_blank" rel="noopener">Google</a></span>` : "<span></span>";
  const mapsUrl = address ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(V.mapsQuery || address)}` : "";

  /* ---------- icons ---------- */
  const I = {
    arrow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
    diag: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>`,
    plus: `<svg class="base" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
    ok: `<svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
    x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
    lock: `<svg class="base" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`
  };

  /* ---------- blocks ---------- */
  const rsvpLabel = "Request an RSVP";
  const rsvpPill = (cls = "pill--accent", label = rsvpLabel, arrow = true) => `<button class="pill ${cls}" type="button" data-rsvp><span data-rsvp-label="${esc(label)}">${esc(label)}</span>${arrow ? " " + I.arrow : ""}</button>`;

  const Kit = {
    E, V, F, I, R, $, $$, esc, has, reduce, START, END, guest, demo,
    rsvpPill, calChips, gcal, setEffects,

    /* nav: brand left, one quiet text link right. The only RSVP button lives in the hero. */
    nav: () => `<nav class="nav e" style="--d:.1s" aria-label="Site">
        <a class="brand" href="#" aria-label="${esc(E.brand || E.title)}">${mark}${E.logo && E.logoOnly ? "" : esc(E.brand || E.title)}</a>
        <div class="nav__right"><button class="navlink" type="button" data-open>Event details</button></div>
      </nav>`,

    /* the hero's action row: one RSVP button left, when + where right */
    cta: (cls = "") => `<div class="act-row ${cls}">
        ${rsvpPill("pill--accent pill--cta")}
        <p class="act-row__meta">${esc(F.long ? F.long.replace(/, \d{4}$/, "") : "")}<span>${esc([F.start, V.short || V.city].filter(Boolean).join(", "))}</span></p>
      </div>`,

    lead: (lines = E.lead || []) => lines.length ? `<h2 class="lead">${lines.map((l, i) => `<span class="e" style="--d:${.15 + i * .07}s">${esc(l)}</span>`).join("")}</h2>` : "",

    /* the giant word: solid, one span per letter for the entrance */
    giant: (word = E.giant || E.title, tag = "h1") => {
      const html = [...String(word).toUpperCase()].map((c, k) => `<span style="--k:${k}">${c === " " ? "&nbsp;" : esc(c)}</span>`).join("");
      return `<${tag} class="giant" data-fit aria-label="${esc(word)}">${html}</${tag}>`;
    },

    copy: (cls = "") => E.intro ? `<div class="copy ${cls}"><p>${esc(E.intro)}</p></div>` : "",

    meta: () => `<dl class="meta">
        ${has(E.hosts) ? `<div><dt>Hosted by</dt><dd>${E.hosts.map(esc).join("<br>")}</dd></div>` : ""}
        ${has(E.served) ? `<div><dt>Served</dt><dd>${E.served.map(esc).join("<br>")}</dd></div>` : ""}
      </dl>`,

    cards: (delay = 1.05) => `<section class="cards" aria-label="Event details">
        ${F.short ? `<button class="card e" type="button" data-cal style="--d:${delay}s" aria-label="Add ${esc(F.long)} to your calendar">
          <span class="act" aria-hidden="true">${I.plus}${I.ok}</span><span class="card__big">${esc(F.short)}</span><span class="card__lbl">${esc(F.weekday)}</span></button>` : ""}
        ${F.start ? `<div class="card e" style="--d:${delay + .07}s"><span class="card__big">${esc(F.start)}</span><span class="card__lbl">Until ${esc(F.end)}</span></div>` : ""}
        ${address
          ? `<div class="card card--where e" style="--d:${delay + .14}s"><a class="act" href="${mapsUrl}" target="_blank" rel="noopener" aria-label="Open directions">${I.diag}</a>
              <button class="copybtn" type="button" data-copy aria-label="Copy address: ${esc(address)}"><span class="card__big" data-addr>${esc(V.address)}</span></button><span class="card__lbl">${esc(V.city || "")}</span></div>`
          : `<button class="card card--where e" type="button" data-open style="--d:${delay + .14}s" aria-label="Address shared after RSVP">
              <span class="act" aria-hidden="true">${I.lock}</span><span class="card__big">${esc(V.short || V.name || V.city || "")}</span><span class="card__lbl">Address after RSVP</span></button>`}
        ${hasDate ? `<div class="card card--count e" style="--d:${delay + .21}s"><span class="card__big count" data-count aria-live="off">--</span><span class="card__lbl" data-count-lbl>Until doors open</span></div>` : ""}
      </section>`,

    /* the shared chrome: loader, wipes, modal, toast */
    /* chrome(type): type is the preloader — "wipes" | "doors" | "blur" */
    chrome: (type = E.preloader || "wipes") => { Kit._pre = type; return `
      <div class="pre pre--${type}" data-pre aria-hidden="true">${Kit.preloader(type)}</div>
      <dialog class="modal" id="details" aria-labelledby="m-title"><div class="modal__panel">
        <div class="modal__head"><div><p class="modal__over">${guest ? esc(guest) + ", you're invited" : "You're invited"}</p><h2 class="modal__title" id="m-title">${esc(E.title || "")}</h2></div>
          <button class="x" type="button" data-close aria-label="Close">${I.x}</button></div>
        <ul class="rows">
          ${hasDate ? `<li class="row" style="--i:0"><span class="row__k">When</span><span class="row__v">${esc(F.long)}<small>${esc(F.range)}</small></span>${calChips()}</li>` : ""}
          <li class="row" style="--i:1"><span class="row__k">Where</span><span class="row__v">${esc(V.name || V.short || "")}<small>${esc(address || [V.short, V.city].filter(Boolean).join(", ") + ". Address shared after you RSVP")}</small></span>${address ? `<button class="chip" type="button" data-act="copy">Copy</button>` : "<span></span>"}</li>
          ${has(E.served) ? `<li class="row" style="--i:2"><span class="row__k">Served</span><span class="row__v">${esc(E.served[0])}<small>${esc(E.served.slice(1).join(", "))}</small></span><span></span></li>` : ""}
          ${has(E.hosts) ? `<li class="row" style="--i:3"><span class="row__k">Hosts</span><span class="row__v">${esc(E.hosts[0])}<small>${E.hosts.length > 1 ? "with " + esc(E.hosts.slice(1).join(" & ")) : ""}</small></span><span></span></li>` : ""}
        </ul>
        <div class="modal__foot">
          ${rsvpPill("pill--accent")}
          ${mapsUrl ? `<a class="pill pill--ghost" href="${mapsUrl}" target="_blank" rel="noopener">Directions</a>` : ""}
          <button class="pill pill--ghost" type="button" data-act="share">Share</button>
        </div>
      </div></dialog>
      <dialog class="modal modal--rsvp" id="rsvp" aria-labelledby="r-title"><div class="modal__panel">
        <div class="modal__head"><div><p class="modal__over" id="r-over"></p><h2 class="modal__title" id="r-title"></h2></div>
          <button class="x" type="button" data-close-rsvp aria-label="Close">${I.x}</button></div>
        <div class="step" id="r-step"></div>
      </div></dialog>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>`; },

    /* ---------- three preloaders ---------- */
    preloader(type) {
      const markSvg = RUMOR("rmark");
      const markImg = E.logo ? `<img src="${esc(E.logo)}" alt="">` : markSvg;
      const brand = E.logo && E.logoOnly ? "" : esc(E.brand || E.title);
      if (type === "doors") {
        /* the same centred face is drawn in both doors; each door shows its half */
        const face = `<div class="door__face"><div class="loader__mark loader__mark--big">${markImg}</div><div class="door__brand">${brand}</div><div class="loader__num" data-num>000</div></div>`;
        return `<div class="door door--l"><div class="door__in">${face}</div></div><div class="door door--r"><div class="door__in">${face}</div></div><i class="door__seam"></i>`;
      }
      if (type === "blur") {
        const line = E.preloadLine || [((E.lead || []).slice(-1)[0] || ""), E.giant || ""].join(" ").trim() || E.title || "";
        const words = line.split(/\s+/).filter(Boolean);
        return `<div class="blur__top">${E.logo ? markImg : `<div class="loader__mark">${markSvg}</div>`}</div>
          <p class="blur__line">${words.map((w, i) => `<span style="--w:${i}"${i === words.length - 1 ? ' class="last"' : ""}>${esc(w)}</span>`).join(" ")}</p>
          <div class="blur__bar"><i data-bar></i></div>`;
      }
      return `<div class="loader"><div class="loader__inner">
          <div class="loader__mark">${markImg}${brand}</div>
          <div class="loader__bar"><i data-bar></i></div><div class="loader__num" data-num>000</div></div></div>
        <div class="wipe wipe--1"></div><div class="wipe wipe--2"></div><div class="wipe wipe--3"></div>`;
    },

    /* ---------- in-page RSVP: details → code → request received ---------- */
    rsvpState() { try { return JSON.parse(localStorage.getItem("rsvp:" + (E.title || "")) || "null") || Kit._mem || null; } catch { return Kit._mem || null; } },
    syncRsvp() {
      const s = Kit.rsvpState();
      document.body.classList.toggle("requested", !!s);
      $$("[data-rsvp-label]").forEach(l => l.textContent = s ? "Request sent" : l.dataset.rsvpLabel);
    },
    openRsvp() {
      if (!demo) { if (R.url) window.open(R.url, "_blank", "noopener"); return; }
      const d = $("#details"); if (d.open) d.close();
      const m = $("#rsvp");
      Kit.rsvpStep(Kit.rsvpState() ? "done" : "form");
      if (!m.open) { m.classList.remove("closing"); m.showModal(); }
    },
    closeRsvp() {
      const m = $("#rsvp"); if (!m.open || m.classList.contains("closing")) return;
      if (reduce) return m.close();
      m.classList.add("closing");
      const done = () => { if (m.open) { m.classList.remove("closing"); m.close(); } };
      m.querySelector(".modal__panel").addEventListener("animationend", done, { once: true }); setTimeout(done, 400);
    },
    rsvpStep(step, data = {}) {
      Kit._r = Object.assign(Kit._r || {}, data);
      const r = Kit._r, box = $("#r-step"), over = $("#r-over"), title = $("#r-title");
      const masked = r.cc && r.phone ? `${r.cc} ••• ••• ${r.phone.slice(-4)}` : "";
      if (step === "form") {
        over.textContent = guest ? `${guest}, you're invited` : "Request an RSVP";
        title.textContent = E.title || "";
        box.innerHTML = `<form class="form" id="r-form" novalidate>
            <label class="field"><span>Full name</span><input name="fullname" autocomplete="name" required value="${esc(r.name || guest || "")}" placeholder="First and last name"></label>
            <label class="field"><span>Mobile number</span><span class="phone">
              <select name="cc" aria-label="Country code">${["+1","+44","+971","+91","+33","+49","+61","+52","+55"].map(c => `<option${c === (r.cc || "+1") ? " selected" : ""}>${c}</option>`).join("")}</select>
              <input name="phone" type="tel" inputmode="tel" autocomplete="tel-national" required value="${esc(r.phone || "")}" placeholder="(305) 555 0123"></span></label>
            <p class="form__err" id="r-err" role="alert"></p>
            <button class="pill pill--accent pill--block" type="submit">Send code ${I.arrow}</button>
            <p class="form__note">${esc(R.note || "")}${demo && R.demoNote ? " " + esc(R.demoNote) : ""}</p>
          </form>`;
        const f = $("#r-form");
        f.onsubmit = (e) => {
          e.preventDefault();
          const name = f.fullname.value.trim(), phone = f.phone.value.replace(/\D/g, "");
          const err = name.length < 2 ? "Add your name so the host knows who's asking." : phone.length < 7 ? "Enter a mobile number with at least 7 digits." : "";
          if (err) { $("#r-err").textContent = err; f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); (name.length < 2 ? f.fullname : f.phone).focus(); return; }
          Kit.rsvpStep("code", { name, phone, cc: f.cc.value });
        };
        setTimeout(() => f.querySelector(r.name || guest ? 'input[name="phone"]' : "input").focus(), 60);
      }
      if (step === "code") {
        over.textContent = "Check your texts";
        title.textContent = "Enter the code";
        box.innerHTML = `<form class="form" id="r-code" novalidate>
            <p class="form__lead">We sent a 4-digit code to <b>${esc(masked)}</b>.</p>
            <div class="otp">${[0,1,2,3].map(i => `<input inputmode="numeric" maxlength="1" aria-label="Digit ${i + 1}" ${i === 0 ? 'autocomplete="one-time-code"' : ""}>`).join("")}</div>
            <p class="form__err" id="r-err" role="alert"></p>
            <button class="pill pill--accent pill--block" type="submit">Verify ${I.arrow}</button>
            <p class="form__note"><button type="button" class="link" id="r-back">Use a different number</button> · <button type="button" class="link" id="r-resend">Resend code</button></p>
          </form>`;
        const f = $("#r-code"), boxes = $$(".otp input", f);
        const value = () => boxes.map(b => b.value).join("");
        const check = () => {
          if (value().length < 4) { $("#r-err").textContent = "Enter all 4 digits."; return; }
          if (demo && value() !== "1234") {
            $("#r-err").textContent = "That code didn't match. In this demo the code is 1234.";
            f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
            boxes.forEach(b => b.value = ""); boxes[0].focus(); return;
          }
          const state = { name: r.name, last4: r.phone.slice(-4), cc: r.cc, at: Date.now() };
          Kit._mem = state;
          try { localStorage.setItem("rsvp:" + (E.title || ""), JSON.stringify(state)); } catch {}
          Kit.syncRsvp(); Kit.rsvpStep("done");
        };
        boxes.forEach((b, i) => {
          b.addEventListener("input", () => {
            const digits = b.value.replace(/\D/g, "");
            if (digits.length > 1) { digits.slice(0, 4).split("").forEach((d, k) => { if (boxes[k]) boxes[k].value = d; }); }
            else b.value = digits;
            const next = boxes.find(x => !x.value); (next || boxes[3]).focus();
            $("#r-err").textContent = "";
            if (value().length === 4) check();
          });
          b.addEventListener("keydown", (e) => { if (e.key === "Backspace" && !b.value && i) { boxes[i - 1].value = ""; boxes[i - 1].focus(); } });
          b.addEventListener("paste", (e) => { const t = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 4); if (t) { e.preventDefault(); t.split("").forEach((d, k) => boxes[k].value = d); if (t.length === 4) check(); } });
        });
        f.onsubmit = (e) => { e.preventDefault(); check(); };
        $("#r-back").onclick = () => Kit.rsvpStep("form");
        $("#r-resend").onclick = () => Kit.say("New code sent");
        setTimeout(() => boxes[0].focus(), 60);
      }
      if (step === "done") {
        const s = Kit.rsvpState() || {};
        const first = (s.name || r.name || "").split(" ")[0];
        over.textContent = "Request received";
        title.textContent = first ? `Thanks, ${first}` : "Thanks";
        box.innerHTML = `<p class="form__lead">${esc(host1)} reviews every request. If you're on the list, you'll get a text${s.last4 ? ` at ••• ${esc(s.last4)}` : ""} with the address before ${esc(F.weekday || "the event")}.</p>
          <ul class="rows">
            ${hasDate ? `<li class="row" style="--i:0"><span class="row__k">When</span><span class="row__v">${esc(F.long)}<small>${esc(F.range)}</small></span>${calChips()}</li>` : ""}
            <li class="row" style="--i:1"><span class="row__k">Status</span><span class="row__v">Pending approval<small>Sent ${s.at ? new Date(s.at).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "just now"}</small></span><span></span></li>
          </ul>
          <div class="modal__foot"><button class="pill pill--accent" type="button" data-close-rsvp>Done</button><button class="pill pill--ghost" type="button" data-act="share">Share</button></div>
          ${demo ? `<p class="form__note"><button type="button" class="link" id="r-reset">Reset this demo</button></p>` : ""}`;
        const reset = $("#r-reset");
        if (reset) reset.onclick = () => { Kit._mem = null; try { localStorage.removeItem("rsvp:" + (E.title || "")); } catch {} Kit._r = {}; Kit.syncRsvp(); Kit.rsvpStep("form"); };
      }
      box.classList.remove("step--in"); void box.offsetWidth; box.classList.add("step--in");
    },

    /* ---------- behaviour ---------- */
    say(msg) {
      const toast = $("#toast"), open = $$("dialog[open]").pop();
      const host = open || document.body;
      if (toast.parentNode !== host) host.appendChild(toast);
      toast.textContent = msg; toast.classList.add("show");
      clearTimeout(Kit._t); Kit._t = setTimeout(() => toast.classList.remove("show"), 1900);
    },
    async copyAddress() {
      try { await navigator.clipboard.writeText(address); Kit.say("Address copied"); return true; } catch { Kit.say(address); return false; }
    },
    addToCalendar() {
      const e = (s) => String(s).replace(/[,;]/g, m => "\\" + m);
      const st = (s) => `${Y}${String(M).padStart(2, "0")}${String(D).padStart(2, "0")}T${(s || "00:00").replace(":", "")}00`;
      const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Invite//EN","CALSCALE:GREGORIAN","BEGIN:VEVENT",
        `UID:${E.date}-${(E.title || "event").replace(/\W+/g, "-").toLowerCase()}@invite`,
        "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z",
        `DTSTART;TZID=${tz}:${st(E.startTime)}`, `DTEND;TZID=${tz}:${st(E.endTime || E.startTime)}`,
        "SUMMARY:" + e(E.title || ""), "LOCATION:" + e(address || [V.name, V.city].filter(Boolean).join(", ")),
        "DESCRIPTION:" + e(E.intro || ""), "END:VEVENT","END:VCALENDAR"].join("\r\n");
      const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
      const a = Object.assign(document.createElement("a"), { href: url, download: (E.title || "event").replace(/\W+/g, "-").toLowerCase() + ".ics" });
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      Kit.say("Calendar file downloaded");
    },
    openModal() { const m = $("#details"); if (m.open) return; m.classList.remove("closing"); m.showModal(); },
    closeModal() {
      const m = $("#details"); if (!m.open || m.classList.contains("closing")) return;
      if (reduce) return m.close();
      m.classList.add("closing");
      const done = () => { if (m.open) { m.classList.remove("closing"); m.close(); } };
      m.querySelector(".modal__panel").addEventListener("animationend", done, { once: true }); setTimeout(done, 400);
    },

    fit() {
      $$("[data-fit]").forEach(el => {
        const par = el.parentElement, cs = getComputedStyle(par);
        const box = (par.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) || innerWidth;
        el.style.fontSize = "100px"; el.style.width = "max-content";
        const w = el.getBoundingClientRect().width || 1;
        el.style.width = "";
        const cap = parseFloat(el.dataset.capVh || 29) / 100 * innerHeight;
        el.style.fontSize = Math.min(100 * box / w * 0.99, cap) + "px";
      });
    },

    wire() {
      /* open / close */
      document.addEventListener("click", async (ev) => {
        const t = ev.target;
        if (t.closest("[data-rsvp]")) { Kit.openRsvp(); return; }
        if (t.closest("[data-close-rsvp]")) { Kit.closeRsvp(); return; }
        if (t.closest("[data-open]")) { Kit.openModal(); return; }
        if (t.closest("[data-close]")) { Kit.closeModal(); return; }
        const cal = t.closest("[data-cal]");
        if (cal) { Kit.addToCalendar(); cal.classList.add("is-done"); setTimeout(() => cal.classList.remove("is-done"), 2200); return; }
        const cp = t.closest("[data-copy]");
        if (cp && await Kit.copyAddress()) { const a = cp.querySelector("[data-addr]"); a.textContent = "Copied"; setTimeout(() => a.textContent = V.address, 1600); return; }
        const act = t.closest("[data-act]"); if (!act) return;
        const k = act.dataset.act;
        const label = act.dataset.label || (act.dataset.label = act.textContent);
        if (k === "cal") { Kit.addToCalendar(); act.textContent = "Added"; act.classList.add("is-done"); setTimeout(() => { act.textContent = label; act.classList.remove("is-done"); }, 2200); }
        if (k === "copy" && await Kit.copyAddress()) { act.textContent = "Copied"; act.classList.add("is-done"); setTimeout(() => { act.textContent = label; act.classList.remove("is-done"); }, 1600); }
        if (k === "share") {
          const data = { title: E.title, text: [E.title, F.short, F.start].filter(Boolean).join(". "), url: location.href };
          if (navigator.share) { try { await navigator.share(data); } catch {} }
          else { try { await navigator.clipboard.writeText(location.href); Kit.say("Link copied"); } catch { Kit.say(location.href); } }
        }
      });
      document.addEventListener("keydown", (ev) => {
        const o = ev.target.closest && ev.target.closest('[role="button"][data-open]');
        if (o && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); Kit.openModal(); }
      });
      const m = $("#details");
      m.addEventListener("cancel", (ev) => { ev.preventDefault(); Kit.closeModal(); });
      m.addEventListener("click", (ev) => { if (ev.target === m) Kit.closeModal(); });
      const rm = $("#rsvp");
      rm.addEventListener("cancel", (ev) => { ev.preventDefault(); Kit.closeRsvp(); });
      rm.addEventListener("click", (ev) => { if (ev.target === rm) Kit.closeRsvp(); });
      Kit.syncRsvp();

      /* phone sheet: drag the top of the sheet down to close */
      const panel = m.querySelector(".modal__panel"), handle = m.querySelector(".modal__head");
      let py = null, pdy = 0, pt = 0;
      handle.addEventListener("pointerdown", (e) => {
        if (!matchMedia("(max-width:720px)").matches || e.target.closest("button,a")) return;
        py = e.clientY; pdy = 0; pt = performance.now(); handle.setPointerCapture(e.pointerId); panel.style.transition = "none";
      });
      handle.addEventListener("pointermove", (e) => { if (py === null) return; pdy = Math.max(0, e.clientY - py); panel.style.transform = `translateY(${pdy}px)`; });
      const release = () => {
        if (py === null) return; py = null;
        const fast = pdy / Math.max(1, performance.now() - pt) > 0.6;
        if (pdy > 110 || (fast && pdy > 30)) {
          panel.style.transition = "transform .25s cubic-bezier(.32,.72,0,1)"; panel.style.transform = "translateY(100%)";
          setTimeout(() => { m.close(); panel.style.transition = ""; panel.style.transform = ""; }, 250);
        } else { panel.style.transition = "transform .45s var(--spring)"; panel.style.transform = ""; setTimeout(() => { panel.style.transition = ""; }, 450); }
      };
      handle.addEventListener("pointerup", release); handle.addEventListener("pointercancel", release);

      /* countdown — only re-render the parts that changed */
      let last = "";
      const tick = () => {
        const els = $$("[data-count]"), lbls = $$("[data-count-lbl]"); if (!els.length) return;
        const now = Date.now();
        if (now >= END) { els.forEach(e => e.textContent = "That's a wrap"); lbls.forEach(l => l.textContent = "Thanks for coming"); return; }
        if (now >= START) { els.forEach(e => e.textContent = "Live now"); lbls.forEach(l => l.textContent = "Until " + F.end); return setTimeout(tick, 30000); }
        let s = Math.floor((START - now) / 1000);
        const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const mi = Math.floor(s / 60); s -= mi * 60;
        const p = (n) => String(n).padStart(2, "0");
        const parts = [d + "d", p(h) + "h", p(mi) + "m", p(s) + "s"];
        els.forEach(el => {
          if (!last || el.children.length !== 4) el.innerHTML = parts.map(x => `<span class="digit">${x}</span>`).join(" ");
          else [...el.children].forEach((c, i) => { if (c.textContent !== parts[i]) { c.textContent = parts[i]; if (!reduce) { c.classList.remove("tick"); void c.offsetWidth; c.classList.add("tick"); } } });
        });
        last = parts.join(); setTimeout(tick, 1000 - (Date.now() % 1000));
      };
      tick();

      /* fit giant words */
      Kit.fit();
      addEventListener("resize", Kit.fit);
      if (document.fonts) document.fonts.ready.then(Kit.fit);
    },

    /* preloader: time-based count, then three panels lift and the page enters */
    boot(onIn) {
      const body = document.body;
      const enter = () => { body.classList.add("in"); onIn && onIn(); };
      const pre = $("[data-pre]"), type = Kit._pre || "wipes";
      const drop = () => pre && pre.remove();
      if (reduce) { drop(); return enter(); }
      const nums = $$("[data-num]"), bar = $("[data-bar]");
      /* seen it this visit? skip the preloader, keep the entrance (always plays inside the showcase) */
      let seen = false; const key = "seen:" + (E.title || "") + location.pathname;
      try { seen = window.top === window && !!sessionStorage.getItem(key); if (window.top === window) sessionStorage.setItem(key, "1"); } catch {}
      if (seen) { drop(); return requestAnimationFrame(() => requestAnimationFrame(enter)); }
      requestAnimationFrame(() => requestAnimationFrame(() => pre.classList.add("is-on")));
      const MIN = type === "blur" ? 2200 : 1600, t0 = performance.now(); let done = false, ready = false;
      const show = (p) => { nums.forEach(n => n.textContent = String(Math.round(p * 100)).padStart(3, "0")); if (bar) bar.style.transform = `scaleX(${p})`; };
      /* how each preloader leaves: [when the page starts entering, when the preloader is removed] */
      const exits = {
        wipes: () => { body.classList.add("revealing"); return [420, 1500]; },
        doors: () => { pre.classList.add("is-open"); return [620, 1700]; },
        blur:  () => { pre.classList.add("is-out"); return [520, 1300]; }
      };
      Promise.all([document.fonts ? document.fonts.ready : 0, E.cover ? new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = E.cover; }) : 0]).then(() => ready = true);
      setTimeout(() => ready = true, 3500);
      const finish = () => {
        if (done) return; done = true; show(1);
        setTimeout(() => {
          pre.style.pointerEvents = "none";
          const [inAt, dropAt] = (exits[type] || exits.wipes)();
          setTimeout(enter, inAt);
          setTimeout(drop, dropAt);
        }, 220);
      };
      setTimeout(finish, 4500);
      (function frame() {
        if (done) return;
        const t = Math.min(1, (performance.now() - t0) / MIN);
        const p = ready ? 1 - Math.pow(1 - t, 3) : Math.min(.9, 1 - Math.pow(1 - t, 3));
        show(p);
        if (t >= 1 && ready) return finish();
        requestAnimationFrame(frame);
      })();
    }
  };
  window.Kit = Kit;
})();

</script>

<script type="text/html" id="page-slides">
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>%%KIT_CSS%%</style>
<script>window.EVENT = window.parent.EVENT;<\/script>
<script>%%KIT_JS%%<\/script>
<style>
  html,body{height:100%}
  body{overflow:hidden;overscroll-behavior:none}
  .shell{height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:0 var(--pad) var(--pad);padding-bottom:max(var(--pad),env(safe-area-inset-bottom))}
  .deck{position:relative;min-height:0}
  .slide{position:absolute;inset:0;display:grid;visibility:hidden;pointer-events:none}
  .slide.on{visibility:visible;pointer-events:auto}
  .slide.out{visibility:visible;opacity:0;translate:0 -24px;transition:opacity .3s var(--ease),translate .4s var(--ease)}

  /* each slide replays the kit entrance when it becomes active */
  body.in .slide:not(.on) .e{opacity:0;translate:0 18px;transition:none}
  body.in .slide:not(.on) .giant > span{translate:0 105%;transition:none}
  body.in .slide.out .e,body.in .slide.out .giant > span{opacity:1;translate:0 0}

  /* 1 — the invite */
  /* HERO: type left, framed photo right */
  .s1{grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);grid-template-rows:1fr;column-gap:clamp(24px,4vw,72px)}
  .s1__copy{align-self:center;display:grid;gap:clamp(10px,2vh,20px);min-width:0}
  .media{position:relative;align-self:center;justify-self:end;height:min(64vh,640px);aspect-ratio:4/5;border-radius:28px;overflow:hidden;background:var(--card);margin:0}
  .media img{width:100%;height:100%;object-fit:cover;transform:scale(1.18);transition:transform 2.6s cubic-bezier(.16,1,.3,1) .2s}
  body.in .slide.on .media img{transform:scale(1.02)}
  body.in .slide:not(.on) .media img{transform:scale(1.18);transition:none}
  @media (prefers-reduced-motion: reduce){ .media img{transform:none!important} }

  /* 2 — the details */
  .s2{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(20px,4vw,64px);align-items:center}
  .s2 .lead{text-align:left;font-size:clamp(34px,min(5vw,8vh),76px);line-height:.92;margin-bottom:22px}
  .s2 .copy{max-width:420px}
  .s2 .copy p{font-size:clamp(15px,1.2vw,17px)}
  .s2 .cards{grid-template-columns:1fr 1fr;gap:10px}
  .s2 .card{min-height:clamp(120px,22vh,200px);padding:20px 22px}
  .s2 .card__big{font-size:clamp(26px,min(3.2vw,5.6vh),52px)}

  /* 3 — RSVP */
  .s3{align-content:end;gap:clamp(10px,2vh,20px);padding-bottom:4px}

  /* bottom bar */

<div id="chrome"></div>
<div class="shell" id="shell"></div>
<script>
  const K = window.Kit, E = K.E, F = K.F;
  document.getElementById("chrome").outerHTML = K.chrome("blur");
  const names = ["The invite", "The details", "RSVP"];
  document.getElementById("shell").innerHTML = `
    ${K.nav()}
    <main class="deck" id="deck">
      <section class="slide s1" aria-label="1 of 3: The invite">
        <div class="s1__copy">
          ${K.lead()}
          ${K.giant()}
          <div class="e" style="--d:.8s">${K.cta()}</div>
        </div>
        ${E.cover ? `<figure class="media e" style="--d:.45s"><img src="${K.esc(E.cover)}" alt="${K.esc(E.coverAlt || "")}"></figure>` : ""}
      </section>
      <section class="slide s2" aria-label="2 of 3: The details">
        <div>
          <h2 class="lead e" style="--d:.1s">The details</h2>
          <div class="e" style="--d:.2s">${K.copy()}</div>
        </div>
        ${K.cards(.25)}
      </section>
      <section class="slide s3" aria-label="3 of 3: RSVP">
        ${K.lead(F.long ? [F.long] : [])}
        ${K.giant("RSVP", "h2")}
        <div class="act-row e" style="--d:.7s">
          ${K.rsvpPill("pill--accent pill--cta")}
          ${F.short ? `<button class="pill pill--ghost" type="button" data-act="cal">Add to calendar</button>` : ""}
        </div>
      </section>
    </main>
    <div class="bar e" style="--d:.4s">
      <div class="step"><b id="num">01</b><div class="dots" id="dots"><i></i><i></i><i></i></div></div>
      <div class="btns">
        <button class="pill pill--ghost prev" type="button" id="prev" aria-label="Previous slide">Back</button>
        <button class="pill pill--ink" type="button" id="next"><span id="nextLbl">Next</span> ${K.I.arrow}</button>
      </div>
    </div>`;

  /* the RSVP slide's giant word gets a smaller cap so the buttons fit */
  document.querySelector(".s3 .giant").dataset.capVh = "34";
  document.querySelector(".s1 .giant").dataset.capVh = "30";

  const slides = [...document.querySelectorAll(".slide")], dots = [...document.querySelectorAll("#dots i")];
  let cur = -1, busy = false;
  const show = (n) => {
    if (busy || n === cur || n < 0 || n >= slides.length) return;
    busy = true;
    const prev = slides[cur];
    if (prev) { prev.classList.add("out"); prev.classList.remove("on"); }
    setTimeout(() => {
      if (prev) prev.classList.remove("out");
      slides[n].classList.add("on"); cur = n;
      document.getElementById("num").textContent = String(n + 1).padStart(2, "0");
      
      dots.forEach((d, i) => d.classList.toggle("on", i === n));
      document.getElementById("prev").disabled = n === 0;
      document.getElementById("nextLbl").textContent = n === slides.length - 1 ? "RSVP" : (innerWidth < 480 ? "Next" : "Next: " + names[n + 1]);
      try { history.replaceState(null, "", "#" + (n + 1)); } catch (e) {}
      setTimeout(() => busy = false, 500);
    }, prev ? 320 : 0);
  };
  const next = () => cur === slides.length - 1 ? K.openModal() : show(cur + 1);
  document.getElementById("next").onclick = next;
  document.getElementById("prev").onclick = () => show(cur - 1);
  addEventListener("keydown", (e) => {
    if (document.getElementById("details").open || !document.body.classList.contains("in")) return;
    if (["ArrowRight", "ArrowDown", "PageDown"].includes(e.key)) { e.preventDefault(); next(); }
    if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  });
  let lock = 0;
  addEventListener("wheel", (e) => {
    if (document.getElementById("details").open || Math.abs(e.deltaY) < 14) return;
    const now = Date.now(); if (now < lock) return; lock = now + 1100;
    e.deltaY > 0 ? (cur < slides.length - 1 && show(cur + 1)) : show(cur - 1);
  }, { passive: true });
  let sx = 0;
  addEventListener("touchstart", (e) => sx = e.touches[0].clientX, { passive: true });
  addEventListener("touchend", (e) => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) dx < 0 ? (cur < slides.length - 1 && show(cur + 1)) : show(cur - 1); }, { passive: true });

  K.wire();
  let start = 0; try { const h = +location.hash.slice(1) - 1; if (h > 0 && h < slides.length) start = h; } catch (e) {}
  K.boot(() => show(start));
<\/script>
</body>
</html>

</script>

*{box-sizing:border-box}
html,body{height:100%}

/* ---------- Mobile: sidebar becomes a top bar ---------- */
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{padding:12px 12px 10px;overflow:visible}
  .brand,.label,.side__foot,.item small,.fx{display:none}
  .list{grid-template-columns:repeat(3,1fr)}
  .item{grid-template-columns:1fr;justify-items:center;text-align:center;padding:8px 4px;gap:6px}
  .item .ico{width:32px;height:32px}
  .item strong{font-size:13px}
  .stage{padding:0}
  .frame,.stage[data-mode="phone"] .frame{width:100%;height:100%;border-radius:0;box-shadow:none}
}
@media (prefers-reduced-motion: reduce){
  .frame,.seg i{transition:none}
  iframe{transition:opacity .2s ease}
  iframe.is-swapping{filter:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Versions">
    <div class="brand"><h1 id="evTitle"></h1><p id="evMeta"></p></div>
    <div class="label" id="listLabel">Choose a version</div>
    <ul class="list" id="list" aria-labelledby="listLabel"></ul>
    <div class="label" id="fxLabel">Effects</div>
    <div class="fx" role="group" aria-labelledby="fxLabel">
      <label class="fx__row"><span><strong>Shadows</strong><small>Depth under cards and buttons</small></span><input type="checkbox" role="switch" data-fx="shadows"></label>
      <label class="fx__row"><span><strong>Neon glow</strong><small>Light leak, glowing button</small></span><input type="checkbox" role="switch" data-fx="glow"></label>
      <label class="fx__row"><span><strong>Gradients</strong><small>Fading hero word, photo shading</small></span><input type="checkbox" role="switch" data-fx="gradients"></label>
      <label class="fx__row"><span><strong>Grain</strong><small>Film grain over the page</small></span><input type="checkbox" role="switch" data-fx="grain"></label>
      <button class="fx__reset" type="button" id="fxReset">Reset to event.js</button>
    </div>
    <div class="side__foot">
      <div class="seg" id="seg" data-mode="desktop" role="group" aria-label="Preview size">
        <i aria-hidden="true"></i>
        <button type="button" data-mode="desktop" aria-pressed="true">Desktop</button>
        <button type="button" data-mode="phone" aria-pressed="false">Phone</button>
      </div>
      <div class="actions">
        <button class="abtn" type="button" id="replay"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Replay</button>
        <button class="abtn" type="button" id="full"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Full screen</button>
      </div>
      <div class="note">Use 1, 2, 3 to switch versions.</div>
    </div>
  </aside>
  <main class="stage" id="stage" data-mode="desktop">
    <div class="frame" id="frame"><iframe id="view" title="Microsite preview"></iframe></div>
  </main>
</div>

<script>
(() => {
  const E = window.EVENT || {}, $ = (id) => document.getElementById(id);
  // the showcase keeps its own neutral palette; each version applies the event theme itself
  document.title = (E.title ? E.title + ": " : "") + "microsite versions";
  $("evTitle").textContent = E.title || "Event microsite";
  const [y, m, d] = (E.date || "").split("-").map(Number);
  const dt = y ? new Date(y, m - 1, d) : null;
  $("evMeta").textContent = [dt && dt.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }), (E.venue || {}).city].filter(Boolean).join(", ");

  const ICONS = {
    microsite: `<path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/>`,
    slides: `<rect x="3" y="5" width="14" height="11" rx="2"/><path d="M7 19h10a2 2 0 0 0 2-2V9"/>`,
    onepage: `<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M13 4v16"/>`
  };
  const VERSIONS = [
    { id: "onepage", file: "onepage.html", name: "One screen", desc: "Doors preloader. Everything on one screen" },
    { id: "slides", file: "slides.html", name: "Slides", desc: "Blur-reveal preloader. Three screens, no scroll" },
    { id: "microsite", file: "microsite.html", name: "Scrolling", desc: "Count and colour-wipe preloader. Scrolls" }
  ];
  const BAKED = window.BAKED_VERSIONS || null;   // filled in by build.py / the single-file merge

  /* ?view=onepage | slides | scroll → that version full screen, no sidebar (the link to send guests) */
  const pv = (new URLSearchParams(location.search).get("view") || "").toLowerCase();
  const pvId = { onepage: "onepage", one: "onepage", slides: "slides", scroll: "microsite", scrolling: "microsite", microsite: "microsite" }[pv];
  if (pvId && BAKED) {
    document.body.innerHTML = "";
    document.body.style.cssText = "margin:0;overflow:hidden;background:" + ((E.theme || {}).paper || "#000");
    const f = document.createElement("iframe");
    f.title = E.title || "Invitation";
    f.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0";
    f.srcdoc = BAKED[pvId];
    document.body.appendChild(f);
    f.addEventListener("load", () => { try { f.contentWindow.focus(); } catch (e) {} });
    document.title = E.title || "Invitation";
    return;
  }

  $("list").innerHTML = VERSIONS.map((v, i) => `<li><button class="item" type="button" data-i="${i}" aria-current="${i === 0}">
    <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[v.id]}</svg></span>
    <span><strong>${v.name}</strong><small>${v.desc}</small></span></button></li>`).join("");
  const items = [...document.querySelectorAll(".item")];
  const view = $("view");
  let cur = -1;

  const load = (i) => {
    const v = VERSIONS[i];
    if (BAKED) view.srcdoc = BAKED[v.id]; else view.src = v.file;
  };
  /* effects: start from event.js, change live, survive version switches and Replay */
  const fxDefault = Object.assign({ shadows: false, glow: false, gradients: false, grain: false }, E.effects || {});
  let fx = Object.assign({}, fxDefault);
  const fxInputs = [...document.querySelectorAll("[data-fx]")];
  const syncFxUI = () => fxInputs.forEach(i => i.checked = fx[i.dataset.fx] !== false);
  const applyFx = () => { try { const k = view.contentWindow.Kit; if (k && k.setEffects) k.setEffects(fx); } catch (e) {} };
  fxInputs.forEach(i => i.addEventListener("change", () => { fx[i.dataset.fx] = i.checked; applyFx(); }));
  document.getElementById("fxReset").addEventListener("click", () => { fx = Object.assign({}, fxDefault); syncFxUI(); applyFx(); });
  syncFxUI();

  view.addEventListener("load", () => { view.classList.remove("is-swapping"); applyFx(); try { view.contentWindow.focus(); } catch (e) {} });

  const show = (i, force) => {
    if (i < 0 || i >= VERSIONS.length || (i === cur && !force)) return;
    cur = i;
    items.forEach((b, k) => b.setAttribute("aria-current", k === i));
    try { history.replaceState(null, "", "#" + VERSIONS[i].id); } catch (e) {}
    view.classList.add("is-swapping");
    setTimeout(() => load(i), 200);
  };
  items.forEach(b => b.addEventListener("click", () => show(+b.dataset.i)));

  /* device toggle */
  const seg = $("seg"), stage = $("stage");
  seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    const mode = b.dataset.mode;
    seg.dataset.mode = stage.dataset.mode = mode;
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  }));

  $("replay").addEventListener("click", () => show(cur, true));
  $("full").addEventListener("click", () => {
    const el = $("frame");
    (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  });
  addEventListener("keydown", (e) => { if (["1","2","3"].includes(e.key)) show(+e.key - 1); });

  const start = VERSIONS.findIndex(v => "#" + v.id === location.hash);
  show(start >= 0 ? start : 0);
})();
</script>
</body>
</html>
